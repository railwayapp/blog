name: CMS GraphQL contracts

on:
  pull_request:
    paths:
      - "lib/cms/**"
      - "scripts/seo/**"
      - "lib/types.ts"
      - "codegen.yml"
      - "test/cms/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".prettierrc"
      - ".github/workflows/cms-graphql.yml"
  push:
    paths:
      - "lib/cms/**"
      - "scripts/seo/**"
      - "lib/types.ts"
      - "codegen.yml"
      - "test/cms/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".prettierrc"
      - ".github/workflows/cms-graphql.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn test --runInBand test/cms
      - run: yarn test:seo
